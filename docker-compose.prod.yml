# Production overlay (no bind mounts, no reload, DB not published).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Set strong secrets in .env first:
#   POSTGRES_PASSWORD, OPENAI_API_KEY, CORS_ORIGINS, optionally REQUIRE_AUTH + OPS_API_KEYS

services:
  db:
    ports: !reset []
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    environment:
      APP_ENV: production
      ALLOW_LOCAL_TEST: "false"
      SEED_PLAYBOOK_ON_STARTUP: ${SEED_PLAYBOOK_ON_STARTUP:-true}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      OPS_API_KEYS: ${OPS_API_KEYS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HF_HOME: /home/appuser/.cache/huggingface
    volumes: !reset
      - huggingface_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        API_URL: http://backend:8000
    environment:
      API_URL: http://backend:8000
      NODE_ENV: production
    volumes: !reset []
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
