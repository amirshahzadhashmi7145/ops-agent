services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexar}
      POSTGRES_DB: ${POSTGRES_DB:-nexar_ops}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexar} -d ${POSTGRES_DB:-nexar_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexar}:${POSTGRES_PASSWORD:-nexar}@db:5432/${POSTGRES_DB:-nexar_ops}
      ALLOW_LOCAL_TEST: "true"
      INTERNAL_API_BASE_URL: http://backend:8000
      CORS_ORIGINS: http://localhost:3001,http://localhost:3000,http://frontend:3000
      LLM_PROVIDER: openai
      EMBEDDING_PROVIDER: local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  huggingface_cache:
  frontend_node_modules:
